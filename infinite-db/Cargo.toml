[package]
name = "infinite-db"
version = "0.4.0"
authors = ["Jonesey's Innovation"]
edition = "2024"
rust-version = "1.85"
description = "A spatial-graph database using n-dimensional curves and hyperedges for engineering logic."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/infinite-db/0.3.0"
keywords = ["database", "spatial", "hypergraph", "engineering", "peano"]
categories = ["database-implementations", "science"]
repository = "https://github.com/joneseysinno/infinitedb.git"
exclude = [
    "target/**",
    "target2/**",
    "plans/**",
    "proptest-regressions/**",
    "INFINITEDB_PLAN.md",
    "*.orig",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["embedded"]
embedded = []
server = ["embedded", "dep:tokio"]
sync = ["server"]

[dependencies]
# Serialization — zero-copy reads from storage
bincode = "2"
serde = { version = "1", features = ["derive"] }

# Checksums — WAL integrity and Merkle hashing
blake3 = "1"

# Async runtime — server and NVMe I/O (server feature only)
tokio = { version = "1", features = ["full"], optional = true }

# Random session IDs
getrandom = "0.3"

# Phase A CRCW: concurrent reads + fire-and-forget write queue
arc-swap = "1"
crossbeam-channel = "0.5"
dashmap = "6"
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
criterion = "0.5"

[[test]]
name = "hypergraph_m1"
path = "tests/hypergraph_m1.rs"
required-features = ["embedded"]

[[test]]
name = "hypergraph_m4"
path = "tests/hypergraph_m4.rs"
required-features = ["embedded"]

[[test]]
name = "hypergraph_m5"
path = "tests/hypergraph_m5.rs"
required-features = ["embedded"]

[[test]]
name = "hypergraph_m6"
path = "tests/hypergraph_m6.rs"
required-features = ["embedded"]

[[test]]
name = "hypergraph_m7"
path = "tests/hypergraph_m7.rs"
required-features = ["embedded"]

[[test]]
name = "concurrent_db"
path = "tests/concurrent_db.rs"
required-features = ["embedded"]

[[test]]
name = "concurrent_db_phase_c"
path = "tests/concurrent_db_phase_c.rs"
required-features = ["embedded"]

[[test]]
name = "durability"
path = "tests/durability.rs"
required-features = ["embedded"]

[[test]]
name = "crcw_correctness"
path = "tests/crcw_correctness.rs"
required-features = ["embedded"]

[[test]]
name = "server_phase_d"
path = "tests/server_phase_d.rs"
required-features = ["sync"]

[[test]]
name = "server_executor"
path = "tests/server_executor.rs"
required-features = ["sync"]

[[bin]]
name = "infinite-db-test"
path = "src/bin/infinite-db-test.rs"
required-features = ["sync"]

[[example]]
name = "quickstart"
required-features = ["embedded"]
